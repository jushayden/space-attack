<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Space Attack</title>
</head>
<body>
  <main>
    <section class="cabinet" aria-label="Space Attack arcade game">
      <div class="hud">
        <strong id="score" aria-label="Score" title="Score">000000</strong>
        <strong id="best" aria-label="High score" title="High score">000000</strong>
      </div>
      <div id="game" role="application" aria-label="Move with A and D or arrow keys. Fire with Space or left click. Enter starts or restarts. Escape pauses."></div>
      <div id="overlay">
        <h1 id="title">SPACE ATTACK</h1>
        <button id="start">START GAME</button>
      </div>
      <footer>
        <div id="lives" aria-label="2 spare ships"></div>
        <strong id="wave" aria-label="Wave" title="Wave">1</strong>
      </footer>
    </section>
    <details id="settings">
      <summary>SETTINGS</summary>
      <div id="settings-body"><button id="sound" aria-pressed="false">SOUND OFF</button></div>
    </details>
    <p id="save-status" role="status"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
